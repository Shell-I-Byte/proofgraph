name: release-gates
'on':
  push:
    branches: ['**']
    tags: ['v1.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.9', '1.27.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - run: go test -shuffle=on -count=3 ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go build -trimpath -buildvcs=false -o proofgraph-repro ./cmd/proofgraph
      - run: go mod verify
      - run: python3 tools/independent_cli_probes.py
      - name: Required report properties, checksum and replay regression
        run: |
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/proofgraph-shape" ./cmd/proofgraph
          python3 tools/required_report_cli_probes.py "$RUNNER_TEMP/proofgraph-shape"
      - name: Strict Security IR verification-presence CLI contract
        run: |
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/proofgraph-ir" ./cmd/proofgraph
          python3 tools/verification_state_cli_probes.py "$RUNNER_TEMP/proofgraph-ir"
      - name: Result v1 schema-validation forgery regression
        run: |
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/proofgraph-result" ./cmd/proofgraph
          python3 tools/result_schema_cli_probes.py "$RUNNER_TEMP/proofgraph-result"
      - name: Self-rehashed report cross-field falsification
        run: |
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/proofgraph-consistency" ./cmd/proofgraph
          python3 tools/result_consistency_cli_probes.py "$RUNNER_TEMP/proofgraph-consistency"
      - name: Derived result impact metrics consistency falsification
        run: |
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/proofgraph-derived" ./cmd/proofgraph
          python3 tools/derived_metrics_cli_probes.py "$RUNNER_TEMP/proofgraph-derived"
      - name: Linux synthetic FIFO swap falsification
        run: |
          go build -o "$RUNNER_TEMP/proofgraph-race" ./cmd/proofgraph
          python3 tools/race_input_swap.py "$RUNNER_TEMP/proofgraph-race" --iterations 100 --timeout 0.3 --require-no-hangs
      - name: Linux synthetic input-ancestor symlink and exchange regression
        run: |
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/proofgraph-input-chain" ./cmd/proofgraph
          python3 tools/input_ancestor_probes.py "$RUNNER_TEMP/proofgraph-input-chain" --count 120
      - name: Linux synthetic output-parent symlink exchange
        run: |
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/proofgraph-output" ./cmd/proofgraph
          python3 tools/parent_swap_output_probe.py "$RUNNER_TEMP/proofgraph-output" --count 250
      - name: Linux output ancestor symlink-exchange regression
        run: |
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/proofgraph-output-chain" ./cmd/proofgraph
          python3 tools/ancestor_swap_output_probe.py "$RUNNER_TEMP/proofgraph-output-chain" --count 200
      - run: python3 tools/native_ci_contract_tests.py
      - run: python3 tools/verify_release_manifest.py --source .
  analyzers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  native:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            expected_os: linux
            expected_arch: arm64
          - os: macos-15
            expected_os: darwin
            expected_arch: arm64
          - os: windows-2025
            expected_os: windows
            expected_arch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Native runner identity
        shell: bash
        env:
          EXPECTED_OS: ${{ matrix.expected_os }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          set -euo pipefail
          test "$(go env GOOS)" = "$EXPECTED_OS"
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - run: go test -shuffle=on -count=2 ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go mod verify
      - run: go run ./cmd/proofgraph version
